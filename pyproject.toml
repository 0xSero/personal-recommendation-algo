[tool.poetry]
name = "personal-recommender"
version = "0.1.0"
description = "Local personal recommendation system using pre-trained models"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "recommender"}]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.104.0"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
qdrant-client = "^1.7.0"
duckdb = "^0.9.0"
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
numpy = "^1.26.0"
torch = "^2.1.0"
sentence-transformers = "^2.2.0"
transformers = "^4.35.0"
openai = "^1.3.0"  # For vLLM OpenAI-compatible API
feedparser = "^6.0.10"
trafilatura = "^1.6.0"
yt-dlp = "^2023.11.0"
aiofiles = "^23.2.0"
httpx = "^0.25.0"
python-multipart = "^0.0.6"
pyyaml = "^6.0.1"
scipy = "^1.11.0"
pandas = "^2.1.0"
tenacity = "^8.2.3"
click = "^8.1.0"
rich = "^13.7.0"
requests = "^2.31.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
black = "^23.11.0"
ruff = "^0.1.0"
mypy = "^1.7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
